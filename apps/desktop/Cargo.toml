[package]
name = "serein"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["development-data"]
development-data = ["local-store/development-data", "platform/development-data"]
# No-op: token sign-in used to require this flag; it is now always built in.
# Kept only so `--features developer-session` in older scripts keeps building.
developer-session = []
demo = ["dep:test-support", "ui/demo"]

[dependencies]
extensions.workspace = true
serde.workspace = true
serde_json.workspace = true
discord-voice.workspace = true
eframe.workspace = true
ui.workspace = true
model.workspace = true
client-core.workspace = true
discord-api.workspace = true
discord-gateway.workspace = true
discord-protocol.workspace = true
test-support = { workspace = true, optional = true }
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
zeroize.workspace = true
platform.workspace = true
local-store.workspace = true
winit.workspace = true
reqwest.workspace = true
rasterlottie.workspace = true
getrandom.workspace = true
url.workspace = true
time = { workspace = true, features = ["local-offset"] }
sha2 = "=0.10.9"
md4 = "=0.10.2"
semver = "=1.0.28"
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2"] }
cpal = { version = "=0.18.2", default-features = false }
rtrb = "=0.4.0"
symphonia = { version = "=0.6.1", default-features = false, features = ["mp3", "pcm", "wav", "ogg", "vorbis"] }
opus2 = { version = "=0.4.0", default-features = false, features = ["backend-libopus", "static", "bundled"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
png = "=0.18.1"
# Only trusted bundled path/shape SVGs; no text, font discovery, raster images or SVGZ.
resvg = { version = "=0.48.1", default-features = false }
arboard = "=3.6.1"
# Already built for eframe's system-font fallback; lists installed families for font settings.
fontique = { version = "=0.11.1", default-features = false, features = ["system", "fontconfig-dlopen"] }
# Serein never installs a `log` logger, so dependency log calls (wgpu, winit, reqwest, ...)
# are dead code; this feature compiles them out of release builds instead of shipping them.
log = { version = "=0.4.34", features = ["release_max_level_off"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Use Adwaita decorations when the Wayland compositor does not provide a frame (GNOME).
winit = { workspace = true, features = ["wayland-csd-adwaita"] }
# Native Wayland clipboard so copied files paste without an XWayland bridge.
arboard = { version = "=3.6.1", features = ["wayland-data-control"] }
# Media playback sizes PulseAudio buffers itself; voice already selects this host.
cpal = { version = "=0.18.2", default-features = false, features = ["pulseaudio"] }

[build-dependencies]
find-msvc-tools = "=0.1.12"

[dev-dependencies]
test-support.workspace = true

[[example]]
name = "profile_preview"
required-features = ["demo"]

[lints]
workspace = true
