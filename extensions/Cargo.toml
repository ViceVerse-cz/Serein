# The extension SDK and the published catalog plugins. The tutorial examples in
# examples/extensions are a separate workspace that depends on this SDK by path.
[workspace]
members = [
	"sdk",
	"plugins/message-delete-protector",
	"plugins/custom-rpc",
	"plugins/api-proxy",
	"plugins/offline-composer-tools",
	"plugins/text-commands",
	"plugins/view-raw-message",
	"plugins/external-search-tools",
	"plugins/text-codecs",
	"plugins/message-composition-tools",
	"plugins/identity-tools",
	"plugins/loaded-role-members",
	"plugins/status-presets",
	"plugins/message-history",
	"plugins/message-reference-tools",
	"plugins/draft-style-tools",
	"plugins/command-palette",
	"plugins/ingtoninator",
	"plugins/own-message-sed",
	"plugins/social-link-tools",
	"plugins/voice-panel-tools",
	"plugins/server-info-tools",
	"plugins/equicord-community-tools",
	"plugins/plus-reacts-tools",
	"plugins/permissions-tools",
	"plugins/message-inspector-tools",
	"plugins/voice-rejoin-tools",
	"plugins/account-navigation-tools",
	"plugins/message-navigation-tools",
	"plugins/music-link-tools",
	"plugins/more-quick-reactions-tools",
	"plugins/linked-message-tools",
	"plugins/greet-sticker-tools",
	"plugins/better-search-tools",
	"plugins/voice-and-chat-tools",
]
resolver = "3"

[workspace.dependencies]
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serein-extension-sdk = { path = "sdk" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
