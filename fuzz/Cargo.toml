[package]
name = "serein-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

# Keep libFuzzer and nightly instrumentation out of ordinary native builds.
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "=0.4.13"
discord-protocol = { path = "../crates/discord-protocol" }
client-core = { path = "../crates/client-core" }
model = { path = "../crates/model" }
session-cache = { path = "../crates/session-cache" }

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "state-transitions"
path = "fuzz_targets/state_transitions.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
