[workspace]
members = ["sdk", "message-delete-protector", "emoji-sticker-images"]
resolver = "3"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serein-extension-sdk = { path = "sdk" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
