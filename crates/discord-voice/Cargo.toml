[package]
name = "discord-voice"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
client-core.workspace = true
platform.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
serde_json.workspace = true
zeroize.workspace = true
url.workspace = true
getrandom.workspace = true
tracing = { version = "0.1", default-features = false, features = ["max_level_off", "release_max_level_off"] }
davey = { version = "=0.1.4", default-features = false }
openmls = { version = "=0.8.1", default-features = false }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
opus2 = { version = "=0.4.0", default-features = false, features = ["backend-libopus", "static", "bundled"] }
rtrb = "=0.4.0"
cpal = { version = "=0.18.2", default-features = false }
sonora = { version = "=0.2.0", default-features = false }
nnnoiseless = { version = "=0.5.2", default-features = false }
openh264 = "=0.9.8"
image = { version = "=0.25.10", default-features = false }

[dev-dependencies]
sha3 = { version = "=0.10.9", default-features = false }
openmls_rust_crypto = "=0.5.1"
openmls_basic_credential = "=0.5.0"
model.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "=10.0.3", default-features = false, features = ["macos_14_0"] }
objc2 = "=0.6.4"
block2 = "=0.6.2"
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["std", "AVCaptureDevice", "AVCaptureInput", "AVCaptureOutputBase", "AVCaptureSession", "AVCaptureSessionPreset", "AVCaptureVideoDataOutput", "AVMediaFormat", "block2", "dispatch2", "objc2-core-media"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSDictionary", "NSObject", "NSString", "NSValue"] }
objc2-core-media = { version = "=0.3.2", default-features = false, features = ["std", "bitflags", "objc2", "objc2-core-video", "CMBase", "CMTime", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer"] }
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["std", "bitflags", "objc2", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFBase", "CFArray", "CFDictionary", "CFNumber", "CFString"] }
objc2-video-toolbox = { version = "=0.3.2", default-features = false, features = ["std", "bitflags", "objc2", "objc2-core-media", "objc2-core-video", "VTBase", "VTErrors", "VTSession", "VTCompressionProperties", "VTCompressionSession"] }
dispatch2 = "=0.3.1"

# Native permission and capture boundaries permit documented OS calls locally.
[lints.rust]
unsafe_code = "deny"

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "=2.0.1"
windows = { version = "=0.61.3", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_Media_DirectShow", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Graphics_Gdi", "Win32_System_Ole", "Win32_Media_Audio", "Win32_System_Threading", "Win32_Security"] }
windows-core = "=0.61.2"

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "=0.18.2", default-features = false, features = ["pulseaudio"] }
libpulse-sys = "=1.23.0"
libc = "=0.2.189"
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
gstreamer = "=0.25.3"
gstreamer-app = "=0.25.2"
gstreamer-video = "=0.25.3"
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
