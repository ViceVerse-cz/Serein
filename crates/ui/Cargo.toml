[package]
name = "ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
demo = []

[dependencies]
extensions.workspace = true
egui = { workspace = true, features = ["bytemuck"] }
model.workspace = true
client-core.workspace = true
pulldown-cmark = { version = "=0.13.4", default-features = false }
url.workspace = true
time = { workspace = true, features = ["local-offset"] }
unicode-segmentation = "=1.13.3"
unicode-bidi = "=0.3.18"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
ruzstd = { version = "0.9.0", default-features = false, features = ["std"] }
skrifa = { version = "=0.44.0", default-features = false, features = ["std"] }

[dev-dependencies]
test-support.workspace = true

[lints]
workspace = true

[[test]]
name = "own_activity"
required-features = ["demo"]

[[example]]
name = "account_presence"
required-features = ["demo"]

[[example]]
name = "profile_layout"
required-features = ["demo"]

[[example]]
name = "gif_hover"
required-features = ["demo"]

[[example]]
name = "thread_navigation"
required-features = ["demo"]

[[example]]
name = "image_resolution"
required-features = ["demo"]

[[example]]
name = "unread_navigation"
required-features = ["demo"]
