[package]
name = "platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
client-core.workspace = true
model.workspace = true
serde_json.workspace = true
tokio.workspace = true
notify-rust = { version = "=4.18.0", features = ["preview-macos-un"] }
winit.workspace = true
global-hotkey.workspace = true
keyring.workspace = true
url.workspace = true
zeroize.workspace = true
getrandom.workspace = true
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
symphonia = { version = "=0.6.1", default-features = false, features = ["aac"] }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-backend = { version = "=0.3.17", features = ["client_system", "dlopen"] }
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client", "staging"] }
x11-dl = "=2.21.0"
ksni = "=0.3.6"
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util.workspace = true
gtk4 = { version = "=0.11.4", features = ["v4_10"] }
webkit6 = "=0.6.1"

[lints.rust]
# Native integrations permit unsafe only in their audited OS boundaries.
unsafe_code = "deny"

[target.'cfg(target_os = "windows")'.dependencies]
tauri-winrt-notification = "=0.7.3"
windows-core = "=0.61.2"
windows = { version = "=0.61.3", features = ["UI_Notifications", "Win32_Security_Authorization", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

[target.'cfg(target_os = "macos")'.dependencies]
dirs.workspace = true
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSData", "NSGeometry", "objc2-core-foundation"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSWindow", "NSApplication", "NSResponder", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSMenu", "NSMenuItem", "NSImage"] }
futures-lite = "=2.6.1"
mac-usernotifications = "=0.3.1"
objc2-video-toolbox = { version = "=0.3.2", default-features = false, features = ["std", "bitflags", "objc2", "objc2-core-media", "objc2-core-video", "VTBase", "VTErrors", "VTSession", "VTDecompressionSession", "VTDecompressionProperties"] }
objc2-core-media = { version = "=0.3.2", default-features = false, features = ["std", "bitflags", "objc2", "objc2-core-video", "CMBase", "CMTime", "CMAttachment", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer"] }
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["std", "bitflags", "objc2", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFBase", "CFDictionary", "CFNumber", "CFString"] }

[target.'cfg(target_os = "linux")'.dependencies.gstreamer]
version = "=0.25.3"
[target.'cfg(target_os = "linux")'.dependencies.gstreamer-app]
version = "=0.25.2"
[target.'cfg(target_os = "linux")'.dependencies.gstreamer-video]
version = "=0.25.3"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
wry.workspace = true
