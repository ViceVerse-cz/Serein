name: native-client
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: native-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, windows-11-arm, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Mac signing regression (offline)
        if: runner.os != 'Windows'
        run: bash packaging/macos/test_sign_release.sh
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libvulkan-dev libasound2-dev libpulse-dev cmake python3 dpkg-dev desktop-file-utils
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-on-failure: true
      - run: cargo xtask check
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun tests/login-handoff.cjs
      - run: bun tests/xtask-workspace.cjs
      - run: cargo replay
      - run: cargo replay --soak 5
      - name: Linux package regression
        if: runner.os == 'Linux'
        run: PYTHONDONTWRITEBYTECODE=1 python3 packaging/linux/test_package.py
      - name: Package app without demo or developer features
        run: cargo xtask package
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: serein-${{ runner.os }}-${{ runner.arch }}-unsigned
          path: dist/
  security:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: cargo-audit-0.22.2
          cache-targets: false
          cache-on-failure: true
      - run: cargo install cargo-audit --version 0.22.2 --locked --no-default-features
      - run: cargo audit --deny warnings
  licenses:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: cargo-deny-0.20.2
          cache-on-failure: true
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo fetch --locked
      - run: cargo fetch --locked --manifest-path fuzz/Cargo.toml
      - run: cargo xtask licenses
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun tests/license-policy.cjs
  fuzz:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - run: rustup toolchain install nightly-2026-09-09 --profile minimal
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: cargo-fuzz-0.13.2
          cache-on-failure: true
          workspaces: |
            . -> target
            fuzz -> target
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo fetch --locked --manifest-path fuzz/Cargo.toml
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check
      - run: cargo xtask fuzz
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: synthetic-fuzz-failures
          path: target/fuzz-smoke/*.crash
          if-no-files-found: ignore
          retention-days: 7
