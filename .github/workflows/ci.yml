name: native-client
on:
  push:
    branches: [main, comparison/ffmpeg-video-and-reliability]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: native-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows-installer:
    # Run the bounded synthetic installer check on drafts too.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - parallel:
          - uses: dtolnay/rust-toolchain@1.98.1
          - name: Install NSIS
            run: choco install nsis --no-progress -y
      - name: Install, upgrade and uninstall (synthetic/offline)
        run: python packaging/windows/test_installer.py
      - name: Validate Windows update archive migration (offline)
        run: python packaging/windows/test_update_archive.py
  native:
    # Drafts need real native builds too; synthetic installer fixtures cannot
    # validate the compiler, codec DLLs or platform-specific Rust paths.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, windows-11-arm, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      # Steps in one parallel group must not share a Cargo target directory.
      - parallel:
          - name: Mac signing regression (offline)
            if: runner.os != 'Windows'
            run: bash packaging/macos/test_sign_release.sh
          - name: Linux native dependencies
            if: runner.os == 'Linux'
            run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-tools libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libvulkan-dev mesa-vulkan-drivers libasound2-dev libpulse-dev cmake nasm meson ninja-build patchelf libva-dev libdrm-dev python3 dpkg-dev desktop-file-utils xvfb xauth
          - name: macOS encoder build tools
            if: runner.os == 'macOS'
            run: brew install nasm pkg-config meson ninja
          - name: Windows installer build tools
            if: runner.os == 'Windows'
            run: choco install nsis --no-progress -y
          - uses: dtolnay/rust-toolchain@1.98.1
            with:
              components: rustfmt, clippy
      # Parallel actions both open the runner event file; Windows can fail on the shared lock.
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - name: Verify Linux native H.264 plugins
        if: runner.os == 'Linux'
        run: |
          # h264parse belongs to Bad; the software decoder belongs to libav.
          gst-inspect-1.0 --exists h264parse
          gst-inspect-1.0 --exists avdec_h264
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        if: runner.os == 'Windows'
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MSYS
          path-type: inherit
          install: make pkgconf nasm diffutils
      - name: FFmpeg decoder build tools
        if: runner.os == 'Windows'
        run: python -m pip install meson==1.9.2 ninja==1.13.0
      # Cache restoration cleans target paths, including a freshly built FFmpeg
      # prefix. Restore Cargo artifacts before generating the native libraries.
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Prepare native build paths
        shell: bash
        run: |
          # Cargo cache restoration prunes native headers/build trees under target.
          # Keep the native build entirely in fresh job-owned scratch paths.
          ffmpeg_root="${{ runner.temp }}/serein-ffmpeg"
          echo "FFMPEG_DIR=$ffmpeg_root/prefix" >> "$GITHUB_ENV"
          echo "FFMPEG_WORK=$ffmpeg_root/build" >> "$GITHUB_ENV"
          echo "FFMPEG_CACHE=$ffmpeg_root/sources" >> "$GITHUB_ENV"
      - name: Build LGPL-only FFmpeg media libraries
        if: runner.os != 'Windows'
        run: python3 scripts/build-ffmpeg.py --prefix "$FFMPEG_DIR" --work-dir "$FFMPEG_WORK" --cache-dir "$FFMPEG_CACHE"
      - name: Build LGPL-only FFmpeg media libraries (MSVC)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: python scripts/build-ffmpeg.py --prefix "$FFMPEG_DIR" --work-dir "$FFMPEG_WORK" --cache-dir "$FFMPEG_CACHE"
      - name: Preserve FFmpeg configure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ffmpeg-configure-${{ runner.os }}-${{ runner.arch }}
          path: ${{ env.FFMPEG_WORK }}/**/ffbuild/config.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Driver capability query regression fixtures (offline)
        if: runner.os == 'Linux'
        run: python3 crates/discord-voice/tests/native/test_video_queries.py --prefix "$FFMPEG_DIR"
      - name: Encoder buffering and ordering fixtures (offline)
        if: runner.os == 'Linux'
        run: |
          python3 crates/discord-voice/tests/native/test_video_queries.py --suite encoding --prefix "$FFMPEG_DIR"
          python3 crates/discord-voice/tests/native/test_video_queries.py --suite patch --archive "$FFMPEG_DIR/share/serein-ffmpeg/source/ffmpeg-7.1.5.tar.xz"
      - name: Make encoder DLLs available to offline tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"$env:FFMPEG_DIR/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: Check production build without development fixtures
        run: cargo check --locked -p serein --bin serein --no-default-features
      - name: Run cargo xtask check
        if: runner.os == 'Windows'
        run: cargo xtask check
      - name: Run cargo xtask check with native library paths
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # Unit-test binaries outside the desktop crate need the shared native libraries.
          # Set dyld here because macOS system shells strip inherited DYLD variables.
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            export LD_LIBRARY_PATH="$FFMPEG_DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          elif [[ "$RUNNER_OS" == 'macOS' ]]; then
            export DYLD_LIBRARY_PATH="$FFMPEG_DIR/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          fi
          cargo xtask check
      - name: HDR and SDR media shader (offline software Vulkan)
        if: runner.os == 'Linux'
        run: cargo test --locked -p serein --bin serein video::render_tests::media_shader_preserves_sdr_rotation_and_pq_hlg_highlights -- --exact --ignored
        env:
          WGPU_BACKEND: vulkan
          LIBGL_ALWAYS_SOFTWARE: '1'
      - parallel:
          - name: Flatpak encoding after GTK initialization (synthetic)
            if: runner.os == 'Linux'
            run: xvfb-run -a cargo test --locked -p platform --features winit/x11,winit/wayland --lib flatpak_locale_tests::post_gtk_flatpak_encoding_preflight -- --exact --ignored
            env:
              LD_LIBRARY_PATH: ${{ env.FFMPEG_DIR }}/lib
          - run: bun tests/login-handoff.cjs
          - run: bun tests/xtask-workspace.cjs
          - name: FFmpeg native libraries and packaging regression (offline)
            run: python packaging/ffmpeg/test_bundle.py
          - name: Linux package regression
            if: runner.os == 'Linux'
            run: PYTHONDONTWRITEBYTECODE=1 python3 packaging/linux/test_package.py
      - run: cargo replay
      - run: cargo replay --soak 120
      - name: Rebuild the current packager and remove job-owned package output
        shell: bash
        run: |
          cargo build --locked -p xtask
          rm -rf dist dist-installer
      - name: Package app without demo or developer features
        run: cargo xtask package
      - name: Validate and launch the clean Windows package without development DLL paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $checkDir = Join-Path $env:RUNNER_TEMP 'serein-package-clean'
          New-Item -ItemType Directory -Path $checkDir -Force | Out-Null
          $archive = Join-Path $checkDir "serein-v0.0.0-Windows-${env:RUNNER_ARCH}-media-v3.zip"
          Compress-Archive -Path "dist/*" -DestinationPath $archive
          python packaging/windows/check_update_archive.py $archive
          if ($LASTEXITCODE -ne 0) { throw "Windows media update archive validation failed" }
          Expand-Archive $archive -DestinationPath "$checkDir/extracted"
          $buildPath = $env:PATH
          try {
            $nativeRoot = [IO.Path]::GetFullPath($env:FFMPEG_DIR).TrimEnd('\', '/')
            $env:PATH = ($buildPath -split ';' | Where-Object {
              try {
                $entry = [IO.Path]::GetFullPath($_).TrimEnd('\', '/')
                -not ($entry.Equals($nativeRoot, [StringComparison]::OrdinalIgnoreCase) -or $entry.StartsWith("$nativeRoot\", [StringComparison]::OrdinalIgnoreCase))
              } catch { $true }
            }) -join ';'
            # This bounded driver query exits before UI/login/capture/audio initialization.
            $probe = Start-Process "$checkDir/extracted/serein.exe" -ArgumentList '--query-video-codec','nvenc','h264' -PassThru -Wait -RedirectStandardError "$checkDir/launch.log"
            if ($probe.ExitCode -notin 0,1,2,5,9) { throw "Packaged executable failed to load: $($probe.ExitCode)" }
            @{revision=$env:GITHUB_SHA; run='clean'; launchExit=$probe.ExitCode; bytes=(Get-Item $archive).Length; sha256=(Get-FileHash $archive -Algorithm SHA256).Hash} | ConvertTo-Json | Set-Content "$checkDir/result.json"
          } finally { $env:PATH = $buildPath }
      - name: Recheck the cached native build (MSVC)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: python scripts/build-ffmpeg.py --prefix "$FFMPEG_DIR" --work-dir "$FFMPEG_WORK" --cache-dir "$FFMPEG_CACHE" --offline
      - name: Package again with caches and an empty output directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item dist,dist-installer -Recurse -Force
          cargo xtask package
          if ($LASTEXITCODE -ne 0) { throw 'Cached packaging failed' }
          $checkDir = Join-Path $env:RUNNER_TEMP 'serein-package-cached'
          New-Item -ItemType Directory -Path $checkDir -Force | Out-Null
          $archive = Join-Path $checkDir "serein-v0.0.0-Windows-${env:RUNNER_ARCH}-media-v3.zip"
          Compress-Archive -Path "dist/*" -DestinationPath $archive
          python packaging/windows/check_update_archive.py $archive
          if ($LASTEXITCODE -ne 0) { throw 'Cached archive validation failed' }
          Expand-Archive $archive -DestinationPath "$checkDir/extracted"
          $buildPath = $env:PATH
          try {
            $nativeRoot = [IO.Path]::GetFullPath($env:FFMPEG_DIR).TrimEnd('\', '/')
            $env:PATH = ($buildPath -split ';' | Where-Object {
              try {
                $entry = [IO.Path]::GetFullPath($_).TrimEnd('\', '/')
                -not ($entry.Equals($nativeRoot, [StringComparison]::OrdinalIgnoreCase) -or $entry.StartsWith("$nativeRoot\", [StringComparison]::OrdinalIgnoreCase))
              } catch { $true }
            }) -join ';'
            $probe = Start-Process "$checkDir/extracted/serein.exe" -ArgumentList '--query-video-codec','nvenc','h264' -PassThru -Wait -RedirectStandardError "$checkDir/launch.log"
            if ($probe.ExitCode -notin 0,1,2,5,9) { throw "Cached executable failed to load: $($probe.ExitCode)" }
            @{revision=$env:GITHUB_SHA; run='cached'; launchExit=$probe.ExitCode; bytes=(Get-Item $archive).Length; sha256=(Get-FileHash $archive -Algorithm SHA256).Hash} | ConvertTo-Json | Set-Content "$checkDir/result.json"
          } finally { $env:PATH = $buildPath }
      - name: Preserve clean and cached package evidence
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-package-evidence-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/serein-package-clean/result.json
            ${{ runner.temp }}/serein-package-clean/launch.log
            ${{ runner.temp }}/serein-package-cached/result.json
            ${{ runner.temp }}/serein-package-cached/launch.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: serein-${{ runner.os }}-${{ runner.arch }}-unsigned
          path: |
            dist/
            dist-installer/
  extension-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target
            examples/extensions -> target
            extensions -> target
      # The root, examples/extensions and extensions workspaces have separate target directories.
      - parallel:
          - name: Validate catalog packages, manifests and previews (offline)
            run: |
              PYTHONDONTWRITEBYTECODE=1 python3 extensions/test_catalog.py
              python3 extensions/catalog.py --validate
          - run: cargo fmt --manifest-path examples/extensions/Cargo.toml --all -- --check
          - run: cargo fmt --manifest-path extensions/Cargo.toml --all -- --check
      - parallel:
          - run: cargo test --manifest-path examples/extensions/Cargo.toml --workspace --locked
          - run: cargo test --manifest-path extensions/Cargo.toml --workspace --locked
          - run: cargo test --locked -p extensions --test app_contract --example manifest_check
      - parallel:
          - run: cargo clippy --manifest-path examples/extensions/Cargo.toml --workspace --all-targets --locked -- -D warnings
          - run: cargo clippy --manifest-path extensions/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - parallel:
          - run: cargo build --manifest-path examples/extensions/Cargo.toml --workspace --locked --release --target wasm32-unknown-unknown
          - run: cargo build --manifest-path extensions/Cargo.toml --workspace --locked --release --target wasm32-unknown-unknown
      - name: Check existing and rebuilt plugins in the host sandbox (offline)
        run: cargo run --locked --release -p extensions --example sdk_check -- examples/extensions/target/wasm32-unknown-unknown/release extensions/target/wasm32-unknown-unknown/release
      - run: cargo run --locked --release -p extensions --example legacy_sdk_check
  security:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: cargo-audit-0.22.2
          cache-targets: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo install cargo-audit --version 0.22.2 --locked --no-default-features
      - run: cargo audit --deny warnings
  licenses:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: cargo-deny-0.20.2
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - parallel:
          - run: cargo install cargo-deny --version 0.20.2 --locked
          - run: cargo fetch --locked
          - run: cargo fetch --locked --manifest-path fuzz/Cargo.toml
          - uses: oven-sh/setup-bun@v2.2.0
            with:
              bun-version: 1.4.2
      - parallel:
          - run: cargo xtask licenses
          - run: bun tests/license-policy.cjs
  fuzz:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: cargo-fuzz-0.13.2
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target
            fuzz -> target
      - parallel:
          - run: rustup toolchain install nightly-2026-09-09 --profile minimal
          - run: cargo install cargo-fuzz --version 0.13.2 --locked
          - run: cargo fetch --locked --manifest-path fuzz/Cargo.toml
          - run: cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check
      - run: cargo xtask fuzz
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: synthetic-fuzz-failures
          path: target/fuzz-smoke/*.crash
          if-no-files-found: ignore
          retention-days: 7
