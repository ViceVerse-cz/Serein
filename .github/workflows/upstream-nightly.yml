name: Upstream macOS nightlies
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('Nightly build for {0}', inputs.source_sha || github.sha) || 'Sync upstream nightlies' }}

on:
  schedule:
    - cron: '2-57/5 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Commit reachable from this repository to build; defaults to the selected ref
        required: false
        type: string

permissions:
  contents: read

jobs:
  sync:
    if: github.repository != 'ViceVerse-cz/Serein'
    runs-on: ubuntu-latest
    concurrency:
      group: upstream-sync
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    outputs:
      commits: ${{ steps.plan.outputs.commits }}
      latest: ${{ steps.plan.outputs.latest }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Sync canonical main and plan builds
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            requested="${SOURCE_SHA:-$GITHUB_SHA}"
            source_sha="$(git rev-parse --verify "${requested}^{commit}")"
            commits="$(python3 -c 'import json,sys; print(json.dumps([sys.argv[1]]))' "$source_sha")"
            printf 'commits=%s\nlatest=%s\n' "$commits" "$source_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git remote add upstream https://github.com/ViceVerse-cz/Serein.git
          git fetch --no-tags upstream main
          upstream="$(git rev-parse FETCH_HEAD)"
          if git ls-remote --exit-code --heads origin refs/heads/nightly/upstream-state >/dev/null 2>&1; then
            git fetch origin refs/heads/nightly/upstream-state:refs/remotes/origin/nightly/upstream-state
            cursor="$(git rev-parse refs/remotes/origin/nightly/upstream-state)"
          else
            base=origin/main
            if [[ "$EVENT_NAME" == push && -n "$EVENT_BEFORE" && ! "$EVENT_BEFORE" =~ ^0+$ ]]; then
              base="$EVENT_BEFORE"
            fi
            cursor="$(git merge-base "$base" "$upstream")"
          fi
          git merge-base --is-ancestor "$cursor" "$upstream"

          commits="$(git rev-list --reverse "$cursor..$upstream" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().split()[:20]))')"
          latest="$(python3 -c 'import json,sys; commits=json.load(sys.stdin); print(commits[-1] if commits else "")' <<< "$commits")"

          open_sync_pr() {
            git push origin "$upstream:refs/heads/sync/upstream-main"
            local number
            number="$(gh pr list --state open --base main --head sync/upstream-main --json number --jq '.[0].number // empty')"
            if [[ -z "$number" ]]; then
              gh pr create --base main --head sync/upstream-main \
                --title 'chore: sync canonical upstream main' \
                --body "Automated sync from ViceVerse-cz/Serein main at $upstream."
            else
              gh pr edit "$number" --title 'chore: sync canonical upstream main' \
                --body "Automated sync from ViceVerse-cz/Serein main at $upstream."
            fi
          }

          current="$(git rev-parse origin/main)"
          if git merge-base --is-ancestor "$current" "$upstream"; then
            if [[ "$current" != "$upstream" ]] && ! git push origin "$upstream:refs/heads/main"; then
              open_sync_pr
            fi
          elif ! git merge-base --is-ancestor "$upstream" "$current"; then
            open_sync_pr
          fi

          printf 'commits=%s\nlatest=%s\n' "$commits" "$latest" >> "$GITHUB_OUTPUT"

  nightly:
    needs: sync
    if: github.repository != 'ViceVerse-cz/Serein' && needs.sync.outputs.commits != '[]'
    runs-on: macos-15-intel
    timeout-minutes: 90
    concurrency:
      group: upstream-build-${{ matrix.source_sha }}
      cancel-in-progress: false
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source_sha: ${{ fromJSON(needs.sync.outputs.commits) }}
    env:
      SOURCE_SHA: ${{ matrix.source_sha }}
      PACKAGE_ROOT: dist
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ matrix.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set nightly version and release candidate title
        id: version
        run: |
          set -euo pipefail
          base_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"].split("-", 1)[0])')"
          IFS=. read -r major minor patch <<< "$base_version"
          sequence="$(git rev-list --count "$SOURCE_SHA")"
          commit_time="$(git show -s --format=%ct "$SOURCE_SHA")"
          stamp="$(python3 -c 'from datetime import datetime,timezone; import sys; print(datetime.fromtimestamp(int(sys.argv[1]), timezone.utc).strftime("%Y%m%d %Y-%m-%d %H:%M"))' "$commit_time")"
          read -r date display_date display_time <<< "$stamp"
          version="$major.$minor.$((patch + 1))-nightly.$date.$sequence"
          tag="v$version"
          title="Serein Nightly $display_date $display_time UTC (Release Candidate #$sequence)"
          python3 .github/release/version.py "$version"
          printf 'version=%s\ntag=%s\ntitle=%s\nsequence=%s\n' \
            "$version" "$tag" "$title" "$sequence" >> "$GITHUB_OUTPUT"
      - name: Save release metadata
        env:
          TAG: ${{ steps.version.outputs.tag }}
          TITLE: ${{ steps.version.outputs.title }}
        run: |
          mkdir -p release-assets
          printf 'TAG=%q\nTITLE=%q\nSOURCE_SHA=%q\n' \
            "$TAG" "$TITLE" "$SOURCE_SHA" > release-assets/release.env
      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$draft" == false ]]; then
              echo 'published=true' >> "$GITHUB_OUTPUT"
              echo 'draft=false' >> "$GITHUB_OUTPUT"
            else
              echo 'published=false' >> "$GITHUB_OUTPUT"
              echo 'draft=true' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'published=false' >> "$GITHUB_OUTPUT"
            echo 'draft=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@1.98.1
        if: steps.existing.outputs.published != 'true'
        with:
          components: rustfmt, clippy
      - name: Verify Intel runner
        if: steps.existing.outputs.published != 'true'
        run: |
          test "$(uname -m)" = x86_64
          test "$(rustc -vV | sed -n 's/^host: //p')" = x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2.9.2
        if: steps.existing.outputs.published != 'true'
        with:
          cache-on-failure: true
          save-if: true
      - uses: oven-sh/setup-bun@v2.2.0
        if: steps.existing.outputs.published != 'true'
        with:
          bun-version: 1.4.2
      - name: Check and package the macOS app
        if: steps.existing.outputs.published != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cargo xtask check
          bun tests/login-handoff.cjs
          cargo xtask package
          test "$(lipo -archs "$PACKAGE_ROOT/Serein.app/Contents/MacOS/serein")" = x86_64
          asset="serein-${TAG}-macOS-X64.zip"
          ditto -c -k --sequesterRsrc "$PACKAGE_ROOT" "release-assets/$asset"
          (cd release-assets && shasum -a 256 ./*.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: nightly-${{ matrix.source_sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [sync, nightly]
    if: github.repository != 'ViceVerse-cz/Serein' && needs.sync.outputs.commits != '[]'
    runs-on: ubuntu-latest
    concurrency:
      group: upstream-publish-${{ matrix.source_sha }}
      cancel-in-progress: false
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        source_sha: ${{ fromJSON(needs.sync.outputs.commits) }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: nightly-${{ matrix.source_sha }}
          path: release-assets
      - name: Publish timestamped nightly release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source release-assets/release.env
          if draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$draft" == false ]]; then
              echo "Release $TAG is already published."
              exit 0
            fi
          else
            draft=false
          fi
          printf 'Built from upstream commit %s.\n\n[View commit](https://github.com/ViceVerse-cz/Serein/commit/%s).\n' \
            "$SOURCE_SHA" "$SOURCE_SHA" > release-assets/release-notes.md
          if [[ "$draft" == true ]]; then
            gh release upload "$TAG" release-assets/*.zip release-assets/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release-assets/*.zip release-assets/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
              --title "$TITLE" --notes-file release-assets/release-notes.md \
              --prerelease --latest=false --draft
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
            --notes-file release-assets/release-notes.md --draft=false --prerelease --latest=false

  advance-state:
    needs: [sync, nightly, publish]
    if: >-
      always() && github.repository != 'ViceVerse-cz/Serein' && github.event_name != 'workflow_dispatch'
      && needs.sync.result == 'success' && needs.nightly.result == 'success'
      && needs.publish.result == 'success'
      && needs.sync.outputs.commits != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Advance the completed upstream checkpoint
        env:
          LATEST: ${{ needs.sync.outputs.latest }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${LATEST}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin refs/heads/main
          fi
          if ! git cat-file -e "${LATEST}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin refs/heads/sync/upstream-main
          fi
          if git ls-remote --exit-code --heads origin refs/heads/nightly/upstream-state >/dev/null 2>&1; then
            git fetch origin refs/heads/nightly/upstream-state:refs/remotes/origin/nightly/upstream-state
            current="$(git rev-parse refs/remotes/origin/nightly/upstream-state)"
            if git merge-base --is-ancestor "$current" "$LATEST"; then
              git push origin "$LATEST:refs/heads/nightly/upstream-state"
            else
              echo 'The checkpoint already contains a later upstream commit.'
            fi
          else
            git push origin "$LATEST:refs/heads/nightly/upstream-state"
          fi
