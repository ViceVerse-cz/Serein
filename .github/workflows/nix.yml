name: Nix test build
on:
  push:
    branches: [main]
    paths: &paths
      - "flake.*"
      - "nix/**"
      - ".github/workflows/nix.yml"
      - "**/Cargo.*"
      - "rust-toolchain.toml"
      - "crates/**"
      - "apps/**"
      - "vendor/**"
      - "packaging/**"
      - "scripts/build-ffmpeg.py"
      - "assets/**"
      - "LICENSE*"
      - "THIRD_PARTY_NOTICES.md"
      - "README.md"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *paths
  workflow_dispatch:

concurrency:
  group: nix-test-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false

      - name: Build
        run: nix build --print-build-logs --show-trace .#serein
      - name: Verify installed binary
        run: test -x result/bin/serein
      - name: Verify Linux development toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$version"
          nix develop --command sh -c '
            set -eu
            rustc --version | grep -F "rustc $1 "
            cargo --version | grep -F "cargo $1 "
            cargo fmt --version
            cargo clippy --version
          ' _ "$version"
      - name: Verify source overrides use their own lockfile
        if: runner.os == 'Linux'
        shell: bash
        run: |
          fixture=$(mktemp -d)
          trap 'rm -f "$fixture/Cargo.lock"; rmdir "$fixture"' EXIT
          printf 'version = 4\n[[package]]\nname = "synthetic"\nversion = "0.0.0"\n' > "$fixture/Cargo.lock"
          result=$(SEREIN_FIXTURE_SRC="$fixture" nix eval --raw --impure --expr '
            let
              flake = builtins.getFlake (toString ./.);
              src = builtins.path { path = builtins.getEnv "SEREIN_FIXTURE_SRC"; name = "serein-lockfile-fixture"; };
              app = flake.packages.x86_64-linux.serein.overrideAttrs (_: { inherit src; });
            in if builtins.readFile app.cargoDeps.lockFile == builtins.readFile (src + "/Cargo.lock")
              then "ok" else throw "Source override used the wrong Cargo.lock"
          ')
          test "$result" = ok
      - name: Verify packaged speech runtime (offline)
        run: result/bin/serein --self-test-lavasr
      - name: Verify bundled notices and corresponding source
        shell: bash
        run: |
          docs=result/share/doc/serein
          for file in README.md LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md; do
            cmp "$file" "$docs/$file"
          done
          for dir in assets/licenses/*; do
            diff -r "$dir" "$docs/licenses/$(basename "$dir")"
          done
          for file in assets/fonts/*-OFL.txt assets/fonts/*-LICENSE.txt; do
            cmp "$file" "$docs/licenses/$(basename "$file")"
          done
          cmp assets/sounds/README.md "$docs/licenses/notification-sounds.md"
          cmp assets/twemoji/LICENSE-GRAPHICS "$docs/licenses/Twemoji-CC-BY-4.0.txt"
          cmp assets/twemoji/LICENSE-UNICODE "$docs/licenses/Unicode-LICENSE.txt"
          cmp assets/icons/LICENSE "$docs/licenses/Phosphor-Icons-MIT.txt"
          cmp assets/icons/LICENSE-SIMPLE-ICONS "$docs/licenses/Simple-Icons-CC0.txt"
          diff -r vendor/hpke-rs "$docs/source/hpke-rs"
          cmp scripts/build-ffmpeg.py "$docs/ffmpeg-source/build-ffmpeg.py"
          cmp crates/platform/src/video/denoise.rs "$docs/ffmpeg-source/camera-filter/denoise.rs"
          cmp crates/platform/src/video/denoise/gpu.rs "$docs/ffmpeg-source/camera-filter/gpu.rs"
          cmp crates/platform/src/video/denoise/camera_filter.wgsl "$docs/ffmpeg-source/camera-filter/camera_filter.wgsl"
      - name: Verify Linux desktop assets
        if: runner.os == 'Linux'
        run: |
          test -f result/share/applications/cz.viceverse.serein.desktop
          test -f result/share/icons/hicolor/256x256/apps/serein.png
      - name: Report Linux Nix output and closure sizes
        if: runner.os == 'Linux'
        run: |
          nix path-info -sh "$(readlink -f result)"
          nix path-info -Sh "$(readlink -f result)"
      - name: Verify Linux AMD runtime search
        if: runner.os == 'Linux'
        shell: bash
        run: |
          debug=$(mktemp)
          status=0
          env -u LD_LIBRARY_PATH LD_DEBUG=libs result/bin/serein --query-video-codec amf av1 > /dev/null 2> "$debug" || status=$?
          case "$status" in 0|1|2|5|9|10) ;; *) cat "$debug"; exit "$status" ;; esac
          grep -qF '/run/opengl-driver/lib' "$debug"
          rm "$debug"
      - name: Verify macOS app bundle
        if: runner.os == 'macOS'
        run: |
          test -x result/Applications/Serein.app/Contents/MacOS/serein
          plutil -lint result/Applications/Serein.app/Contents/Info.plist
          for library in \
            libavcodec-serein.61.dylib libavutil-serein.59.dylib \
            libavformat-serein.61.dylib libavfilter-serein.10.dylib \
            libswscale-serein.8.dylib libswresample-serein.5.dylib \
            libopenh264.8.dylib; do
            test -s "result/Applications/Serein.app/Contents/Frameworks/$library"
          done
