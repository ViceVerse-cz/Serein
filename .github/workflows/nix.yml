name: Nix test build
on:
  push:
    branches: [main]
    paths: &paths
      - "flake.*"
      - "nix/**"
      - ".github/workflows/nix.yml"
      - "**/Cargo.*"
      - "rust-toolchain.toml"
      - "crates/**"
      - "apps/**"
      - "vendor/**"
      - "packaging/**"
      - "scripts/build-ffmpeg.py"
      - "assets/**"
      - "LICENSE*"
      - "THIRD_PARTY_NOTICES.md"
      - "README.md"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *paths
  workflow_dispatch:

concurrency:
  group: nix-test-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false

      - name: Build
        run: nix build --print-build-logs --show-trace .#serein
      - name: Verify installed binary
        run: test -x result/bin/serein
      - name: Verify bundled notices and corresponding source
        shell: bash
        run: |
          docs=result/share/doc/serein
          for file in README.md LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md; do
            cmp "$file" "$docs/$file"
          done
          for dir in assets/licenses/*; do
            diff -r "$dir" "$docs/licenses/$(basename "$dir")"
          done
          for file in assets/fonts/*-OFL.txt assets/fonts/*-LICENSE.txt; do
            cmp "$file" "$docs/licenses/$(basename "$file")"
          done
          cmp assets/sounds/README.md "$docs/licenses/notification-sounds.md"
          cmp assets/twemoji/LICENSE-GRAPHICS "$docs/licenses/Twemoji-CC-BY-4.0.txt"
          cmp assets/twemoji/LICENSE-UNICODE "$docs/licenses/Unicode-LICENSE.txt"
          cmp assets/icons/LICENSE "$docs/licenses/Phosphor-Icons-MIT.txt"
          cmp assets/icons/LICENSE-SIMPLE-ICONS "$docs/licenses/Simple-Icons-CC0.txt"
          diff -r vendor/hpke-rs "$docs/source/hpke-rs"
      - name: Verify Linux desktop assets
        if: runner.os == 'Linux'
        run: |
          test -f result/share/applications/cz.viceverse.serein.desktop
          test -f result/share/icons/hicolor/256x256/apps/serein.png
      - name: Verify macOS app bundle
        if: runner.os == 'macOS'
        run: |
          test -x result/Applications/Serein.app/Contents/MacOS/serein
          plutil -lint result/Applications/Serein.app/Contents/Info.plist
