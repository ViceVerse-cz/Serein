name: Fork release
run-name: nightly release by @${{ github.actor }}

# Fork-only pipeline: every push to main ships a nightly so installed clients pick the
# change up through the updater. Upstream's release.yml stays untouched; this file never
# exists there, so syncing upstream cannot conflict with it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_CHANNEL: nightly
  SEREIN_SKIP_CASK: '1'

concurrency:
  group: serein-fork-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan nightly release
        id: plan
        run: node .github/release/fork-nightly.mjs
      - name: Apply planned version to manifests
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: python3 .github/release/version.py "$VERSION"
      - name: Auth handoff regression
        run: node tests/login-handoff.cjs
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-manifests
          path: |
            Cargo.toml
            Cargo.lock
            fuzz/Cargo.lock
            packaging/macos/Info.plist
            target/release-plan.json
          if-no-files-found: error
          retention-days: 14

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      PACKAGE_ROOT: dist
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-manifests
          path: .
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - name: Install NSIS
        run: choco install nsis --no-progress -y
      - name: Offline checks
        run: cargo xtask check
      - name: Package app
        run: |
          cargo xtask package
          mkdir release-assets
          echo "ASSET=serein-$TAG-$RUNNER_OS-$RUNNER_ARCH" >> "$GITHUB_ENV"
      - name: Archive Windows package
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:PACKAGE_ROOT/*" -DestinationPath "release-assets/$env:ASSET.zip"
          $installer = Get-ChildItem -Path "dist-installer/*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($installer) {
            Copy-Item -LiteralPath $installer.FullName -Destination "release-assets/$env:ASSET-Setup.exe"
          }
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.ASSET }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --cwd .github/release --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-manifests
          path: .
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: serein-*
          path: release-assets
          merge-multiple: true
      - name: Checksums
        working-directory: release-assets
        run: sha256sum ./* > SHA256SUMS.txt
      - name: Publish nightly release with notes and assets
        run: bun .github/release/release.mjs publish
