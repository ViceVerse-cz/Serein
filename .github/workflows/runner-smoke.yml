name: runner-smoke
on:
  push:
    branches: [ci/self-hosted-runner]
permissions:
  contents: read
jobs:
  check:
    runs-on: serein-ryzen
    steps:
      - run: |
          test "$RUNNER_NAME" = ryzen-serein
          test "$HOME" = /srv/github-runners/serein
          test "$(df -B1 --output=size "$HOME" | tail -1)" -le 75000000000
          df -h "$HOME"
