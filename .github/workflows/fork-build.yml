name: Fork build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # Monotonic version: the built-in updater compares it as semver, so every
      # release must be newer than the previous one.
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog needs the release tags and the commits between them.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Stamp version
        shell: pwsh
        run: |
          $path = 'apps/desktop/Cargo.toml'
          $text = Get-Content $path -Raw
          $stamped = $text -replace 'version\.workspace = true', "version = `"$env:VERSION`""
          if ($stamped -eq $text) { throw "could not stamp $path with $env:VERSION" }
          [IO.File]::WriteAllText((Resolve-Path $path), $stamped, (New-Object Text.UTF8Encoding($false)))

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Build installer
        run: cargo xtask package

      - name: Pack portable build
        shell: pwsh
        run: Compress-Archive -Path "dist/*" -DestinationPath "dist/serein-zapret-portable.zip"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: serein-zapret-${{ env.VERSION }}
          path: |
            dist-installer/*.exe
            dist/serein-zapret-portable.zip
          if-no-files-found: error

      - name: Generate changelog
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: ./tools/release-notes.ps1 -Version $env:VERSION -OutputPath target/release-notes.md

      # Runs triggered by GITHUB_TOKEN do not start another workflow, so this
      # cannot loop back into the build.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: SereinDPI ${{ env.VERSION }}
          body_path: target/release-notes.md
          generate_release_notes: false
          make_latest: true
          files: |
            dist-installer/*.exe
            dist/serein-zapret-portable.zip
