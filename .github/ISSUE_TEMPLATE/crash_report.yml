name: Crash or Performance Issue
description: Report an application crash, panic, freeze, or severe performance regression
title: "[Crash / Performance]: "
labels: ["crash", "performance", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a crash or performance issue.

        > [!TIP]
        > **Diagnostics are strongly recommended, but optional.** In Serein, open **Settings → Updates → Support & diagnostics**, enable **Record diagnostics**, reproduce the problem, then select **Copy diagnostic report** or **Save report…** and include the report below.
        > Recording is off by default. Reports exclude message contents, credentials, account identifiers, paths, and other personal data. Please review attachments before posting publicly. You can submit this issue without diagnostics.

        > [!CAUTION]
        > **NEVER** share your Discord authentication token, passwords, private messages, or raw crash dumps in issues.
        > For a crash or freeze, enable **Save diagnostic history to disk** before reproducing it. This separate option is off by default. Use **Open folder** to find retained files if the copy button cannot be used; the final records may be missing. Copy and Save export current memory history, not previous runs.

  - type: dropdown
    id: issue_category
    attributes:
      label: Issue Category
      description: What type of problem are you experiencing?
      options:
        - "Application Crash / Panic on startup"
        - "Application Crash / Panic during specific action"
        - "Hang / Freeze / UI deadlock"
        - "Excessive CPU usage / Framerate drops"
        - "Memory leak / High RAM consumption"
        - "Graphics / Shader / Driver crash"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe what happened right before the crash, freeze, or performance spike occurred.
      placeholder: "The client abruptly exited when opening voice settings / framerate dropped below 15 FPS when scrolling server list..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to consistently reproduce the crash or performance issue.
      placeholder: |
        1. Launch Serein (optionally enable diagnostics first)
        2. ...
        3. ...
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - "macOS (Apple Silicon - aarch64)"
        - "macOS (Intel - x86_64)"
        - "Linux (Wayland)"
        - "Linux (X11)"
        - "Windows 11"
        - "Windows 10"
        - "Other"
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Graphics Backend (optional)
      description: Broad graphics backend if known. Exact hardware models and other identifying details are not needed.
      placeholder: "e.g. Vulkan, Metal, or DirectX 12"

  - type: input
    id: version
    attributes:
      label: Serein Version / Commit Hash
      description: Release tag or git commit hash. Found in **Settings → Updates** or copied via **"Copy diagnostic report"**.
      placeholder: "e.g. 0.1.0 or commit 36b5336"
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic Report (recommended, optional)
      description: |
        Paste **Copy diagnostic report** output or attach the file from **Save report…** in **Settings → Updates → Support & diagnostics**. If diagnostics were disabled when the problem occurred, enable recording and reproduce it only if you are comfortable doing so. You can also explain why a report is unavailable or leave this field blank.
        Reports contain safe technical categories and timing summaries, not message contents or account identifiers. Review attachments before posting publicly. Do not attach raw terminal output, browser logs, or memory dumps.
      placeholder: Paste a report or drag the exported text file here. Diagnostics are optional.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing GitHub issues and discussions.
          required: true
        - label: I have reviewed my report and attachments for credentials, private messages, and personal information.
          required: true
