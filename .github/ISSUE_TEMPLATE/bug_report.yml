name: Bug Report
description: Report a bug or unexpected behavior in Serein
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Serein!

        > [!TIP]
        > **Quickly copy your client diagnostics:** In Serein, go to **Settings → Updates** and click **"Copy issue diagnostics"** (or click the **"Copy issue info"** link at the bottom of the Settings sidebar) to copy your Serein version, OS, display scale, and theme settings.

        > [!CAUTION]
        > **NEVER** share your Discord authentication token, email, passwords, or personal message content in issues.
        > Please double-check all logs, configuration snippets, and screenshots before submitting.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem you encountered...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can maintainers or contributors reproduce this issue?
      placeholder: |
        1. Launch Serein
        2. Select server / channel '...'
        3. Perform action '...'
        4. Observe the bug
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: What should have happened instead...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: What occurred instead (error message, visual glitch, silent failure)...
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: Which operating system and display server are you running?
      options:
        - "macOS (Apple Silicon - aarch64)"
        - "macOS (Intel - x86_64)"
        - "Linux (Wayland)"
        - "Linux (X11)"
        - "Windows 11"
        - "Windows 10"
        - "Other"
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation Method
      description: How did you install or run Serein?
      options:
        - "GitHub Release (Setup Installer / .app / package)"
        - "Homebrew Cask (macOS)"
        - "Flatpak (Linux)"
        - "Debian / Ubuntu package (.deb)"
        - "Fedora / openSUSE package (.rpm)"
        - "Arch Linux package (.pkg.tar.zst / AUR)"
        - "Built from source (cargo run / cargo build)"
        - "Other"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Serein Version / Commit Hash
      description: Release tag or git commit hash (e.g. `v0.1.0` or `36b5336`). Found in **Settings → Updates** or copied via **"Copy issue diagnostics"**.
      placeholder: "e.g. 0.1.0"
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Client & Environment Diagnostics
      description: |
        Paste the information copied from Serein (**Settings → Updates → "Copy issue diagnostics"** or the sidebar link) here.
      placeholder: |
        - **Serein Version:** ...
        - **Operating System:** ...
        - **Display Scale:** ...
        - **Theme:** ...
        - **Update Channel:** ...
        - **Auto Update:** ...

  - type: input
    id: gpu_backend
    attributes:
      label: GPU & Graphics Backend
      description: GPU model and backend if known (e.g., Apple M-series Metal, NVIDIA RTX 3080 Vulkan, Intel DX12).
      placeholder: "e.g. Apple M2 Max (Metal) or NVIDIA RTX 4070 (Vulkan)"

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & Terminal Output
      description: Paste any console or terminal output here (remember to redact personal tokens or sensitive data).
      render: shell

  - type: textarea
    id: media
    attributes:
      label: Screenshots or Screen Recordings
      description: Drag & drop images or screen recordings demonstrating the issue.

  - type: markdown
    attributes:
      value: |
        ### Collect logs for voice, video, screen sharing or performance issues

        1. Quit Serein completely, then open a terminal and run the command for your platform below.
           Both flags enable voice timing reports and UI frame diagnostics.
        2. Reproduce the issue briefly. For voice problems, join/leave the call yourself and note
           whether you were speaking, muted, sharing your screen or using noise suppression.
           If the call fails, also use **Copy failure reason** in the sidebar or call stage.
        3. Quit Serein normally so the final frame summary is written. Find `serein-diagnostics.log`
           in the terminal's current folder, review it for private information, then drag the file
           into the diagnostics field below (or paste the relevant output).

        **Windows (PowerShell)** — replace the executable path with your installed `serein.exe`:
        ```powershell
        $env:SEREIN_VOICE_DIAGNOSTICS="1"
        $env:SEREIN_FRAME_DIAGNOSTICS="1"
        & "C:\path\to\serein.exe" 2> serein-diagnostics.log
        Remove-Item Env:SEREIN_VOICE_DIAGNOSTICS, Env:SEREIN_FRAME_DIAGNOSTICS
        ```

        **macOS (Terminal):**
        ```sh
        SEREIN_VOICE_DIAGNOSTICS=1 SEREIN_FRAME_DIAGNOSTICS=1 /Applications/Serein.app/Contents/MacOS/serein 2> serein-diagnostics.log
        ```

        **Linux (terminal)** — replace `serein` with your executable/AppImage path if needed:
        ```sh
        SEREIN_VOICE_DIAGNOSTICS=1 SEREIN_FRAME_DIAGNOSTICS=1 serein 2> serein-diagnostics.log
        ```

        **Flatpak:**
        ```sh
        flatpak run --env=SEREIN_VOICE_DIAGNOSTICS=1 --env=SEREIN_FRAME_DIAGNOSTICS=1 cz.viceverse.serein 2> serein-diagnostics.log
        ```

        Voice timing reports appear about every five seconds and stop after a bounded capture;
        restart Serein if you need another capture. If Serein freezes or crashes, send whatever
        output was captured even if the final frame summary is missing. These commands save stderr,
        which can also contain framework logs: review the file before uploading and remove tokens,
        credentials and private content. Diagnostics are disabled on the next normal launch after
        clearing the PowerShell variables above (or closing that terminal).
        See the [voice diagnostics guide](https://github.com/ViceVerse-cz/Serein/blob/main/docs/voice.md#investigating-high-cpu-during-a-call) for details.

  - type: textarea
    id: runtime_diagnostics
    attributes:
      label: Voice / Frame Diagnostics
      description: Attach the reviewed log from the commands above or paste its output. Include any copied call failure reason and what you were doing during the capture. If you could not collect it, describe what prevented it.
      placeholder: Drop serein-diagnostics.log here, or paste the relevant diagnostics and call failure reason...

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing GitHub issues and discussions to verify this has not been reported before.
          required: true
        - label: I have verified that no private Discord tokens, credentials, or sensitive personal data are included.
          required: true
        - label: I am using the latest release or main branch commit.
          required: false
