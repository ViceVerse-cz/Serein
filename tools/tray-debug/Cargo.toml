[package]
name = "tray-debug"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[target.'cfg(target_os = "linux")'.dependencies]
tokio.workspace = true
ksni = "=0.3.6"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
egui.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
winit.workspace = true
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSEnumerator"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSResponder", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSMenu", "NSMenuItem", "NSImage"] }
